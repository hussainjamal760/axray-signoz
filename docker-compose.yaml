services:
  # --- MongoDB Data Store ---
  mongo:
    image: mongo:7.0
    container_name: axray-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - signoz-network

  # --- AXRAY Backend API & Orchestrator ---
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: axray-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Mount Docker socket so Dockerode inside server can manage agent session containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/axray}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:-axray_super_secret_key_change_me}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-http://signoz-ingester-1:4318/v1/traces}
      - SIGNOZ_INSTANCE_URL=${SIGNOZ_INSTANCE_URL:-http://signoz-mcp:8000}
      - SIGNOZ_API_KEY=${SIGNOZ_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:3001/api/auth/github/callback}
    depends_on:
      - mongo
    networks:
      - signoz-network

  # --- AXRAY Next.js Frontend ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: axray-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - NEXT_PUBLIC_SIGNOZ_URL=${NEXT_PUBLIC_SIGNOZ_URL:-http://localhost:8080}
    depends_on:
      - server
    networks:
      - signoz-network

# --- Shared External Network created by SigNoz Foundry ---
networks:
  signoz-network:
    external: true

volumes:
  mongo_data:
