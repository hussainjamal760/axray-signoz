<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="100%" height="100%" style="background: #0B0F19; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif; border-radius: 12px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="agent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <linearGradient id="groq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <linearGradient id="sandbox-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>

    <linearGradient id="signoz-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450A0A" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <linearGradient id="mcp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="user-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>

    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C084FC" />
    </marker>

    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399" />
    </marker>

    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24" />
    </marker>

    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FB7185" />
    </marker>
  </defs>

  <style>
    .title { font-size: 22px; font-weight: 800; fill: #F8FAFC; letter-spacing: 0.5px; }
    .subtitle { font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .node-title { font-size: 15px; font-weight: 700; fill: #F8FAFC; }
    .node-sub { font-size: 11px; font-weight: 600; fill: #94A3B8; font-family: monospace; }
    .node-body { font-size: 12px; fill: #E2E8F0; }
    .badge-text { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
    .label-text { font-size: 11px; font-weight: 700; fill: #FCD34D; letter-spacing: 0.5px; }

    /* Keyframe Animations */
    @keyframes flow-fast {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes flow-slow {
      from { stroke-dashoffset: 60; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulse-node {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; filter: drop-shadow(0 0 14px rgba(99, 102, 241, 0.85)); }
    }

    @keyframes pulse-mcp {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(245, 158, 11, 0.4)); }
      50% { filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.95)); }
    }

    .line-flow-cyan { stroke: #38BDF8; stroke-dasharray: 6 6; animation: flow-fast 1.2s linear infinite; }
    .line-flow-purple { stroke: #C084FC; stroke-dasharray: 6 6; animation: flow-fast 1.5s linear infinite; }
    .line-flow-emerald { stroke: #34D399; stroke-dasharray: 6 6; animation: flow-fast 1.3s linear infinite; }
    .line-flow-rose { stroke: #FB7185; stroke-dasharray: 7 5; animation: flow-fast 1s linear infinite; }
    .line-flow-amber { stroke: #FBBF24; stroke-dasharray: 8 6; animation: flow-slow 1.8s linear infinite; }

    .agent-card { animation: pulse-node 4s ease-in-out infinite; }
    .mcp-card { animation: pulse-mcp 3s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1020" height="660" rx="12" fill="url(#bg-gradient)" stroke="#1E293B" stroke-width="2" />
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.05">
    <path d="M 0 60 L 1020 60 M 0 120 L 1020 120 M 0 180 L 1020 180 M 0 240 L 1020 240 M 0 300 L 1020 300 M 0 360 L 1020 360 M 0 420 L 1020 420 M 0 480 L 1020 480 M 0 540 L 1020 540 M 0 600 L 1020 600" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M 100 0 L 100 660 M 200 0 L 200 660 M 300 0 L 300 660 M 400 0 L 400 660 M 500 0 L 500 660 M 600 0 L 600 660 M 700 0 L 700 660 M 800 0 L 800 660 M 900 0 L 900 660" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(40, 30)">
    <!-- Logo Symbol -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#6366F1" />
    <path d="M 10 18 L 18 10 L 26 18 L 18 26 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="18" cy="18" r="3" fill="#38BDF8" />

    <text x="48" y="22" class="title">AXRAY AGENT ARCHITECTURE</text>
    <text x="48" y="38" class="subtitle">Self-Observing &amp; Self-Correcting Autonomous Agent via OpenTelemetry &amp; SigNoz MCP</text>

    <!-- Top Badges -->
    <g transform="translate(730, 8)">
      <rect x="0" y="0" width="95" height="22" rx="11" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
      <text x="47" y="15" text-anchor="middle" class="badge-text" fill="#38BDF8">OTLP Native</text>

      <rect x="105" y="0" width="105" height="22" rx="11" fill="#1E293B" stroke="#FBBF24" stroke-width="1"/>
      <text x="157" y="15" text-anchor="middle" class="badge-text" fill="#FBBF24">SigNoz MCP</text>
    </g>
  </g>

  <!-- CONNECTIONS & FLOW PATHS -->

  <!-- 1. User CLI -> AXRAY Agent -->
  <path d="M 210 190 L 300 190" stroke="#38BDF8" stroke-width="2.5" class="line-flow-cyan" marker-end="url(#arrow-cyan)"/>
  
  <!-- 2. Agent Core -> Groq LLM -->
  <path d="M 540 145 Q 550 140 560 140" fill="none" stroke="#C084FC" stroke-width="2.5" class="line-flow-purple" marker-end="url(#arrow-purple)"/>

  <!-- 3. Agent Core -> Tool Sandbox -->
  <path d="M 540 230 L 560 250" fill="none" stroke="#34D399" stroke-width="2.5" class="line-flow-emerald" marker-end="url(#arrow-emerald)"/>

  <!-- 4. Agent Core -> OpenTelemetry instrumentation -->
  <path d="M 390 270 L 390 360" fill="none" stroke="#60A5FA" stroke-width="2.5" class="line-flow-cyan" marker-end="url(#arrow-cyan)"/>

  <!-- 5. OTLP Instrumentation -> SigNoz Backend (Traces/Logs/Metrics Stream) -->
  <path d="M 510 410 L 550 410" fill="none" stroke="#FB7185" stroke-width="3" class="line-flow-rose" marker-end="url(#arrow-rose)"/>

  <!-- 6. THE SELF-CORRECTION LOOP: SigNoz MCP -> AXRAY Agent Core (HERO PATH) -->
  <path id="self-check-path" d="M 860 402 C 920 180, 750 45, 420 105" fill="none" stroke="#FBBF24" stroke-width="3.5" class="line-flow-amber" filter="url(#glow-amber)" marker-end="url(#arrow-amber)"/>


  <!-- CARDS & NODES -->

  <!-- NODE 1: User / CLI Trigger -->
  <g transform="translate(40, 140)">
    <rect width="170" height="100" rx="10" fill="url(#user-grad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="26" y="30" text-anchor="middle" fill="#38BDF8" font-weight="bold" font-family="monospace">&gt;_</text>
    
    <text x="48" y="30" class="node-title">User (CLI)</text>
    <text x="12" y="58" class="node-sub">Terminal Prompt</text>
    <text x="12" y="76" class="node-body" fill="#94A3B8">• Task &amp; Repo Path</text>
    <text x="12" y="90" class="node-body" fill="#94A3B8">• CLI Parameters</text>
  </g>


  <!-- NODE 2: AXRAY Agent Core (CENTRAL NODE) -->
  <g transform="translate(300, 110)" class="agent-card">
    <rect width="240" height="160" rx="12" fill="url(#agent-grad)" stroke="#6366F1" stroke-width="2" filter="url(#glow-indigo)"/>
    
    <!-- Header inside card -->
    <rect x="12" y="12" width="32" height="32" rx="8" fill="#4338CA"/>
    <!-- Agent Spark Icon -->
    <path d="M 28 20 L 30 25 L 35 27 L 30 29 L 28 34 L 26 29 L 21 27 L 26 25 Z" fill="#67E8F9"/>
    
    <text x="52" y="30" class="node-title">AXRAY Agent Core</text>
    <text x="52" y="44" class="node-sub">apps/agent/agent-runner.ts</text>
    <line x1="12" y1="54" x2="228" y2="54" stroke="#4F46E5" stroke-width="1"/>

    <!-- Content bullet points -->
    <g transform="translate(14, 72)">
      <circle cx="4" cy="0" r="3" fill="#38BDF8"/>
      <text x="14" y="4" class="node-body">Turn Loop &amp; Context State</text>

      <circle cx="4" cy="20" r="3" fill="#818CF8"/>
      <text x="14" y="24" class="node-body">Tool Dispatch &amp; History</text>

      <circle cx="4" cy="40" r="3" fill="#FBBF24"/>
      <text x="14" y="44" class="node-body" font-weight="bold" fill="#FDE68A">Self-Correction Handler</text>
      <text x="14" y="60" class="node-sub" fill="#FCD34D">(injects prompt on stuck loop)</text>
    </g>
  </g>


  <!-- NODE 3: Groq LLM API -->
  <g transform="translate(560, 100)">
    <rect width="210" height="95" rx="10" fill="url(#groq-grad)" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="12" y="12" width="26" height="26" rx="6" fill="#581C87"/>
    <text x="25" y="29" text-anchor="middle" fill="#E9D5FF" font-weight="bold" font-size="12">AI</text>
    
    <text x="46" y="28" class="node-title">Groq LLM API</text>
    <text x="46" y="42" class="node-sub">openai/gpt-oss-20b</text>
    <line x1="12" y1="50" x2="198" y2="50" stroke="#7E22CE" stroke-width="1"/>

    <text x="12" y="68" class="node-body" fill="#E9D5FF">• Code Generation &amp; Planning</text>
    <text x="12" y="82" class="node-body" fill="#E9D5FF">• Structured Tool Calling</text>
  </g>


  <!-- NODE 4: Sandboxed Tool Execution -->
  <g transform="translate(560, 215)">
    <rect width="210" height="110" rx="10" fill="url(#sandbox-grad)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="12" y="12" width="26" height="26" rx="6" fill="#047857"/>
    <path d="M 20 20 L 30 20 M 20 25 L 30 25 M 20 30 L 26 30" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
    
    <text x="46" y="28" class="node-title">Tool Execution Sandbox</text>
    <text x="46" y="42" class="node-sub">sandbox-runner.ts</text>
    <line x1="12" y1="50" x2="198" y2="50" stroke="#059669" stroke-width="1"/>

    <g transform="translate(12, 66)">
      <rect x="0" y="0" width="85" height="18" rx="4" fill="#065F46"/>
      <text x="42" y="12" text-anchor="middle" class="node-sub" fill="#A7F3D0">read_file</text>

      <rect x="92" y="0" width="85" height="18" rx="4" fill="#065F46"/>
      <text x="134" y="12" text-anchor="middle" class="node-sub" fill="#A7F3D0">write_file</text>

      <rect x="0" y="22" width="85" height="18" rx="4" fill="#065F46"/>
      <text x="42" y="34" text-anchor="middle" class="node-sub" fill="#A7F3D0">run_tests</text>

      <rect x="92" y="22" width="85" height="18" rx="4" fill="#065F46"/>
      <text x="134" y="34" text-anchor="middle" class="node-sub" fill="#A7F3D0">git_commit</text>
    </g>
  </g>


  <!-- NODE 5: OpenTelemetry Instrumentation -->
  <g transform="translate(270, 360)">
    <rect width="240" height="100" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#1E3A8A"/>
    <!-- OTel Icon representation -->
    <circle cx="26" cy="26" r="8" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <path d="M 26 20 L 26 32 M 20 26 L 32 26" stroke="#93C5FD" stroke-width="2"/>
    
    <text x="48" y="28" class="node-title">OpenTelemetry SDK</text>
    <text x="48" y="42" class="node-sub">instrumentation.ts</text>
    <line x1="12" y1="50" x2="228" y2="50" stroke="#1D4ED8" stroke-width="1"/>

    <text x="12" y="68" class="node-body" fill="#93C5FD">• Auto-instrumented HTTP &amp; Spans</text>
    <text x="12" y="84" class="node-body" fill="#93C5FD">• Custom Business Metrics &amp; Logs</text>
  </g>


  <!-- NODE 6: SIGNOZ OBSERVABILITY & MCP SERVER (CONTAINER CARD) -->
  <g transform="translate(550, 350)">
    <!-- Main Outer Container -->
    <rect width="430" height="260" rx="14" fill="#180A0A" stroke="#EF4444" stroke-width="2"/>
    
    <!-- Container Title Bar -->
    <rect x="0" y="0" width="430" height="38" rx="14" fill="#2E0A0A"/>
    <!-- Round top corners only overlay -->
    <rect x="0" y="24" width="430" height="14" fill="#2E0A0A"/>
    
    <text x="16" y="24" class="node-title" fill="#FCA5A5">SigNoz Self-Hosted Platform</text>
    <text x="240" y="24" class="node-sub" fill="#F87171">http://localhost:8080</text>

    <!-- Sub-Box A: SigNoz Collector & DB -->
    <g transform="translate(16, 52)">
      <rect width="185" height="190" rx="10" fill="url(#signoz-grad)" stroke="#991B1B" stroke-width="1.5"/>
      <text x="12" y="24" class="node-title" fill="#FECDD3">SigNoz Engine</text>
      <text x="12" y="38" class="node-sub" fill="#FDA4AF">OTLP Collector</text>
      <line x1="12" y1="46" x2="173" y2="46" stroke="#991B1B" stroke-width="1"/>

      <g transform="translate(12, 62)">
        <rect x="0" y="0" width="160" height="34" rx="6" fill="#450A0A" stroke="#7F1D1D" stroke-width="1"/>
        <text x="10" y="16" class="node-body" font-weight="bold" fill="#FCA5A5">ClickHouse DB</text>
        <text x="10" y="28" class="node-sub" fill="#F87171">Traces + Logs + Metrics</text>

        <rect x="0" y="42" width="160" height="34" rx="6" fill="#450A0A" stroke="#7F1D1D" stroke-width="1"/>
        <text x="10" y="58" class="node-body" font-weight="bold" fill="#FCA5A5">Dashboards &amp; Alerts</text>
        <text x="10" y="70" class="node-sub" fill="#F87171">Live telemetry charts</text>

        <rect x="0" y="84" width="160" height="34" rx="6" fill="#450A0A" stroke="#7F1D1D" stroke-width="1"/>
        <text x="10" y="100" class="node-body" font-weight="bold" fill="#FCA5A5">Query API</text>
        <text x="10" y="112" class="node-sub" fill="#F87171">Span aggregation</text>
      </g>
    </g>

    <!-- Sub-Box B: SigNoz MCP Server (HERO FEATURE) -->
    <g transform="translate(215, 52)" class="mcp-card">
      <rect width="195" height="190" rx="10" fill="url(#mcp-grad)" stroke="#F59E0B" stroke-width="2" filter="url(#glow-amber)"/>
      
      <!-- Beacon indicator -->
      <circle cx="170" cy="22" r="6" fill="#FBBF24"/>
      <circle cx="170" cy="22" r="10" fill="none" stroke="#FBBF24" stroke-width="1.5">
        <animate attributeName="r" values="6;16" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
      </circle>

      <text x="12" y="24" class="node-title" fill="#FEF3C7">SigNoz MCP Server</text>
      <text x="12" y="38" class="node-sub" fill="#FDE68A">Port 8000 (MCP Protocol)</text>
      <line x1="12" y1="46" x2="183" y2="46" stroke="#92400E" stroke-width="1"/>

      <g transform="translate(10, 58)">
        <text x="0" y="14" class="node-body" font-weight="bold" fill="#FEF3C7">Self-Check Service</text>
        <text x="0" y="28" class="node-sub" fill="#FCD34D">self-check.ts (Every Turn)</text>

        <rect x="0" y="38" width="175" height="42" rx="6" fill="#451A03" stroke="#78350F" stroke-width="1"/>
        <text x="8" y="52" class="node-sub" fill="#FBBF24">signoz_execute_builder_query</text>
        <text x="8" y="68" class="node-body" fill="#FEF3C7">Queries current trace spans</text>

        <rect x="0" y="86" width="175" height="38" rx="6" fill="#78350F" stroke="#B45309" stroke-width="1"/>
        <text x="8" y="100" class="node-body" font-weight="bold" fill="#FFFFFF">Loop Detection Engine</text>
        <text x="8" y="114" class="node-sub" fill="#FDE68A">Detects 3+ tool repeats</text>
      </g>
    </g>
  </g>


  <!-- ANNOTATION ON THE HERO LOOP PATH -->
  <g transform="translate(480, 20)">
    <rect x="0" y="0" width="310" height="34" rx="8" fill="#1E1B4B" stroke="#FBBF24" stroke-width="1.5" filter="url(#glow-amber)"/>
    <text x="155" y="15" text-anchor="middle" class="label-text" fill="#FBBF24">SELF-CHECK FEEDBACK LOOP (MCP)</text>
    <text x="155" y="27" text-anchor="middle" class="node-sub" fill="#FDE68A">Injects correction prompt if tool loop detected</text>
  </g>

  <!-- Flow Legend / Footer -->
  <g transform="translate(40, 625)">
    <circle cx="10" cy="-4" r="5" fill="#38BDF8"/>
    <text x="22" y="0" class="node-sub" fill="#94A3B8">Task Flow</text>

    <circle cx="110" cy="-4" r="5" fill="#C084FC"/>
    <text x="122" y="0" class="node-sub" fill="#94A3B8">LLM Reasoning</text>

    <circle cx="230" cy="-4" r="5" fill="#34D399"/>
    <text x="242" y="0" class="node-sub" fill="#94A3B8">Tool Execution</text>

    <circle cx="360" cy="-4" r="5" fill="#FB7185"/>
    <text x="372" y="0" class="node-sub" fill="#94A3B8">OTLP Telemetry</text>

    <circle cx="490" cy="-4" r="5" fill="#FBBF24"/>
    <text x="502" y="0" class="node-sub" fill="#FBBF24" font-weight="bold">Self-Correction Feedback Loop</text>
  </g>

</svg>
